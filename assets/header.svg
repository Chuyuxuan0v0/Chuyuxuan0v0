<svg fill="none" viewBox="0 0 900 460" width="900" height="460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">chuyuxuan profile header</title>
  <desc id="desc">Ling yuan xian yu, bu ru tui er jie wang</desc>
  <foreignObject width="900" height="460">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style><![CDATA[
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .stage {
          position: relative; width: 900px; height: 460px; overflow: hidden;
          border-radius: 16px;
          background: #ffffff;
          color: #1f2329;
          font-family: "Times New Roman", Times, "STZhongsong", "华文中宋", serif;
          border: 1px solid #e5e6eb;
          box-shadow: 0 8px 24px rgba(31, 35, 41, 0.06);
        }
        .stage::before {
          content: ""; position: absolute; inset: 0;
          background:
            radial-gradient(ellipse 70% 60% at 100% 0%, rgba(51, 112, 255, 0.12), transparent 55%),
            radial-gradient(ellipse 50% 50% at 0% 100%, rgba(20, 86, 240, 0.06), transparent 50%),
            linear-gradient(180deg, #f8f9fc 0%, #ffffff 48%, #ffffff 100%);
        }
        .accent {
          position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
          background: linear-gradient(180deg, #3370ff 0%, #1456f0 100%);
        }
        .content {
          position: relative; z-index: 2; height: 100%;
          padding: 56px 64px 48px 72px;
          display: flex; flex-direction: column; justify-content: center;
        }
        .eyebrow {
          display: inline-flex; align-items: center; gap: 8px;
          font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
          color: #3370ff; font-weight: 600;
          opacity: 0; animation: rise 0.9s cubic-bezier(0.32, 0.72, 0, 1) 0.08s forwards;
        }
        .eyebrow::before {
          content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3370ff;
        }
        .name {
          margin-top: 18px;
          font-family: "Times New Roman", Times, serif;
          font-size: 96px; font-weight: 400; line-height: 0.95;
          letter-spacing: -0.02em; color: #1f2329;
          opacity: 0; animation: rise 1s cubic-bezier(0.32, 0.72, 0, 1) 0.18s forwards;
        }
        .handle {
          margin-top: 12px;
          font-family: "Times New Roman", Times, serif;
          font-size: 26px; letter-spacing: 0.04em;
          color: #646a73;
          opacity: 0; animation: rise 1s cubic-bezier(0.32, 0.72, 0, 1) 0.28s forwards;
        }
        .quote {
          margin-top: 32px; max-width: 700px;
          font-family: "STZhongsong", "华文中宋", "Times New Roman", Times, serif;
          font-size: 34px; line-height: 1.45; letter-spacing: 0.08em;
          color: #1f2329;
          opacity: 0; animation: rise 1s cubic-bezier(0.32, 0.72, 0, 1) 0.4s forwards;
        }
        .foot {
          margin-top: 36px;
          display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
          opacity: 0; animation: rise 0.9s cubic-bezier(0.32, 0.72, 0, 1) 0.52s forwards;
        }
        .motto {
          font-family: "STZhongsong", "华文中宋", "Times New Roman", Times, serif;
          font-size: 22px; letter-spacing: 0.1em; color: #3370ff;
        }
        .tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag {
          font-family: "Times New Roman", Times, serif;
          font-size: 15px; padding: 6px 14px; border-radius: 6px;
          color: #1456f0; background: #e8f3ff; border: 1px solid #c2d7ff;
        }
        @keyframes rise {
          from { opacity: 0; transform: translate3d(0, 16px, 0); }
          to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        @media (prefers-reduced-motion: reduce) {
          .eyebrow, .name, .handle, .quote, .foot { animation: none !important; opacity: 1; }
        }
        @media (prefers-color-scheme: dark) {
          .stage {
            background: #1f2329; color: #f5f6f7;
            border-color: #373c43;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
          }
          .stage::before {
            background:
              radial-gradient(ellipse 70% 60% at 100% 0%, rgba(51, 112, 255, 0.2), transparent 55%),
              radial-gradient(ellipse 50% 50% at 0% 100%, rgba(20, 86, 240, 0.1), transparent 50%),
              linear-gradient(180deg, #2b2f36 0%, #1f2329 50%, #1f2329 100%);
          }
          .name { color: #f5f6f7; }
          .handle { color: #8f959e; }
          .quote { color: #f5f6f7; }
          .tag { color: #94bfff; background: rgba(51, 112, 255, 0.16); border-color: rgba(51, 112, 255, 0.35); }
        }
      ]]></style>
      <div class="stage">
        <div class="accent"></div>
        <div class="content">
          <div class="eyebrow">China · Full-stack · AI</div>
          <h1 class="name">chuyuxuan</h1>
          <div class="handle">Chuyuxuan0v0</div>
          <p class="quote">灵渊羡鱼，不如退而结网。</p>
          <div class="foot">
            <span class="motto">少空想，多动手</span>
            <div class="tags">
              <span class="tag">Vue</span>
              <span class="tag">TypeScript</span>
              <span class="tag">Node</span>
              <span class="tag">MCP</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
